name: CI

on:
  push:
    branches: [main, v*-next]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run portable tests
        # ponytail: public CI excludes private SQLite/image assets; full suite runs locally with the dataset mounted.
        run: >
          python -m pytest
          tests/test_config_v9_2.py
          tests/test_v11_2_adapter_access_gate.py
          tests/test_v11_3_fixture_adapter.py
          tests/test_v12_justtcg_fixture_adapter.py
          tests/test_v12_pricing_source_exposure_policy.py
          -q --tb=short
